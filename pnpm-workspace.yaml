packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@aquartier/openledger": ^0.24.0
  "@eslint/js": ^9.39.5
  "@tailwindcss/postcss": ^4.3.5
  "@tanstack/react-query": ^5.107.1
  "@trpc/client": ^11.28.0
  "@trpc/server": ^11.28.0
  "@trpc/tanstack-react-query": ^11.28.0
  "@types/node": ^22.20.5
  ai: ^7.0.169
  better-sqlite3: ^13.0.3
  es-toolkit: ^1.53.2
  eslint: ^9.39.5
  prettier: ^3.6.2
  tailwindcss: ^4.3.5
  tsx: ^4.23.15
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^5.1.0
  zod: ^4.6.7

catalogs:
  react19:
    "@types/react": ~19.3.0
    "@types/react-dom": ~19.3.0
    react: 19.3.1
    react-dom: 19.3.1

linkWorkspacePackages: true

allowBuilds:
  "@tailwindcss/oxide": true
  better-sqlite3: true
  bufferutil: false
  esbuild: true
  sharp: false
  utf-8-validate: false

overrides:
  lightningcss: 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
