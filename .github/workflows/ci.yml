name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_FORCE: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # pnpm first: setup-node's pnpm cache asks pnpm for its store path. The
      # action falls back to standalone pnpm when the runner's Node is too old.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: npm install --global @aquartier/openledger@0.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test

      # `pnpm test` puts the pinned CLI's bin first on PATH. tsx run directly
      # leaves PATH alone, so the connector reaches the global oled, through
      # the npm shim a README install gets on Windows.
      - name: smoke against the global oled
        working-directory: packages/openledger
        shell: bash
        run: ./node_modules/.bin/tsx scripts/smoke.ts

      - run: pnpm build
